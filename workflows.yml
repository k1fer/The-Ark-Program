# ============================================================
# INSTRUCTIONS: Create each file below as a separate .yml file
# inside .github/workflows/ in your repo
# ============================================================


# ---- FILE 1: .github/workflows/athena-morning.yml ----
name: Athena Morning Scan
on:
  schedule:
    - cron: '0 22 * * *'   # 06:00 SGT daily
  workflow_dispatch:
jobs:
  run-athena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python agents/athena.py --mode morning
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}


